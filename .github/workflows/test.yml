name: Test Automatisé (CI)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Tests unitaires et vérification
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer et configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Lancer les tests automatisés
        run: npm test

      - name: Vérifier la compilation (Build)
        run: npm run build
